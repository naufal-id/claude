<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Diagram Proposal PKM Presensi</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; font-family: "Liberation Sans", Arial, sans-serif; }
  svg { display: block; margin-bottom: 24px; }
  .box { fill: #fff; stroke: #1f1f1f; stroke-width: 1.2; }

  .t { font-size: 12px; fill: #111; }
  .tb { font-size: 12px; font-weight: 700; fill: #111; }

  .ln { stroke: #1f1f1f; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
  .lnd { stroke: #1f4e79; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; marker-end: url(#ahb); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker>

</svg>

<!-- Gambar 3.1 Tahap pelaksanaan -->
<svg id="tahap" width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">

  <rect class="box" x="10" y="20" width="140" height="70" rx="6"/>

  <text class="tb" x="20" y="56">Persiapan dan</text>

  <text class="tn" x="180" y="38">TAHAP 2 · Bulan 1</text>

<!-- Lampiran: Arsitektur -->
<svg id="arsitektur" width="640" height="340" viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
  <rect class="box" x="10" y="20" width="175" height="160" rx="6"/>
  <text class="tb" x="22" y="40">Ponsel siswa</text>
  <text class="ts" x="22" y="56">(peramban, tanpa instal aplikasi)</text>
  <text class="ts" x="22" y="78">• Halaman presensi responsif</text>
  <text class="ts" x="22" y="94">• Geolocation API: koordinat</text>
  <text class="ts" x="22" y="108">  + akurasi (izin pengguna)</text>
  <text class="ts" x="22" y="126">• Token perangkat terdaftar</text>
  <text class="ts" x="22" y="144">• Terhubung ke Wi-Fi sekolah</text>
  <text class="ts" x="22" y="168">Siswa menekan "Presensi"</text>

  <rect class="soft" x="10" y="200" width="175" height="60" rx="6"/>
  <text class="tb" x="22" y="222">Wi-Fi sekolah</text>
  <text class="ts" x="22" y="240">HTTPS keluar lewat IP publik</text>
  <text class="ts" x="22" y="254">sekolah (+ access point)</text>
  <line class="ln" x1="97" y1="180" x2="97" y2="198"/>
  <path class="ln" d="M 185 230 L 210 230 L 210 120 L 233 120"/>

  <rect class="acc" x="235" y="20" width="200" height="250" rx="6"/>
  <text class="tb" x="247" y="40">Server (VPS, pusat data</text>
  <text class="tb" x="247" y="55">di Indonesia)</text>
  <text class="ts" x="247" y="78">• Layanan validasi: perangkat,</text>
  <text class="ts" x="247" y="92">  geofence + akurasi, IP</text>
  <text class="ts" x="247" y="106">  jaringan sekolah, jendela waktu</text>
  <text class="ts" x="247" y="124">• Basis data siswa, jadwal,</text>
  <text class="ts" x="247" y="138">  presensi, log audit</text>
  <text class="ts" x="247" y="156">• Mesin aturan anomali</text>
  <text class="ts" x="247" y="174">• Penjadwal notifikasi dan</text>
  <text class="ts" x="247" y="188">  ringkasan mingguan</text>
  <text class="ts" x="247" y="206">• Penghapusan otomatis</text>
  <text class="ts" x="247" y="220">  koordinat setelah 30 hari</text>
  <text class="ts" x="247" y="238">• Ekspor CSV/Excel</text>

  <rect class="box" x="470" y="20" width="160" height="120" rx="6"/>
  <text class="tb" x="482" y="40">Aplikasi web sekolah</text>
  <text class="ts" x="482" y="60">• Guru mapel dan piket</text>
  <text class="ts" x="482" y="76">• Wali kelas dan BK</text>
  <text class="ts" x="482" y="92">• Kepala sekolah</text>
  <text class="ts" x="482" y="108">• Admin tata usaha</text>
  <text class="ts" x="482" y="128">Akses berbasis peran</text>

  <rect class="box" x="470" y="160" width="160" height="80" rx="6"/>
  <text class="tb" x="482" y="180">Bot Telegram</text>
  <text class="ts" x="482" y="200">• Notifikasi masuk/pulang</text>
  <text class="ts" x="482" y="216">• Ringkasan mingguan</text>
  <text class="ts" x="482" y="232">• Pengajuan izin/sakit</text>

  <rect class="box" x="470" y="265" width="160" height="45" rx="6"/>
  <text class="tb" x="482" y="285">Orang tua / wali</text>
  <text class="ts" x="482" y="301">ponsel dengan Telegram</text>
  <line class="ln" x1="550" y1="240" x2="550" y2="263"/>

  <line class="ln" x1="435" y1="75" x2="468" y2="75"/>
  <line class="ln" x1="468" y1="95" x2="437" y2="95"/>
  <line class="ln" x1="435" y1="200" x2="468" y2="200"/>

  <rect class="soft" x="235" y="285" width="200" height="40" rx="6"/>
  <text class="tb" x="247" y="303">Sistem informasi sekolah</text>
  <text class="ts" x="247" y="318">(mis. AIMSIS): impor rekap CSV</text>
  <line class="ln" x1="335" y1="270" x2="335" y2="283"/>
</svg>

<!-- Lampiran: Alur presensi berlapis -->
<svg id="berlapis" width="640" height="330" viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg">
  <rect class="acc" x="10" y="10" width="620" height="68" rx="6"/>
  <text class="tn" x="22" y="28">LAPIS 1 · PRESENSI DATANG DARI PONSEL (pagi)</text>
  <text class="t" x="22" y="47">Siswa membuka halaman presensi → server memvalidasi perangkat, GPS, jaringan, waktu →</text>
  <text class="t" x="22" y="64">status tepat waktu/terlambat tercatat → orang tua menerima notifikasi</text>

  <rect class="box" x="10" y="88" width="620" height="68" rx="6"/>
  <text class="tn" x="22" y="106">LAPIS 2 · KELAS (setiap sesi pelajaran)</text>
  <text class="t" x="22" y="125">Guru membuka sesi → daftar terisi otomatis dari Lapis 1 → guru hanya menandai</text>
  <text class="t" x="22" y="142">pengecualian (tercatat hadir tapi tidak ada di kelas, atau tanpa ponsel) → konfirmasi satu kali</text>

  <rect class="box" x="10" y="166" width="620" height="68" rx="6"/>
  <text class="tn" x="22" y="184">LAPIS 3 · AUDIT (harian, wali kelas/BK)</text>
  <text class="t" x="22" y="203">Mesin aturan menandai anomali (lokasi janggal, akun ganda) → wali kelas meninjau →</text>
  <text class="t" x="22" y="220">wali kelas menetapkan tindak lanjut; semua perubahan data tersimpan di log audit</text>

  <rect class="box" x="10" y="244" width="620" height="68" rx="6"/>
  <text class="tn" x="22" y="262">LAPIS 4 · ORANG TUA (mingguan)</text>
  <text class="t" x="22" y="281">Bot mengirim ringkasan kumulatif (jumlah hadir, terlambat, izin, alpa sejak awal</text>
  <text class="t" x="22" y="298">semester) → orang tua dapat mengajukan izin/sakit → wali kelas menyetujui</text>
</svg>
